<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.5" stop-color="#e8622c"/>
      <stop offset="1" stop-color="#ffb46b"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="#15161a"/>

  <!-- Pulsing status glow around the window -->
  <rect x="410" y="80" width="780" height="440" rx="22" fill="none" stroke="url(#ring)" stroke-width="30" opacity="0.65" filter="url(#blur)"/>

  <g transform="translate(420 90)">
    <rect width="760" height="420" rx="16" fill="#1e1f24" stroke="url(#ring)" stroke-width="4"/>

    <!-- Tabs -->
    <rect x="2" y="2" width="756" height="52" rx="14" fill="#26272d"/>
    <rect x="18" y="12" width="170" height="42" rx="10" fill="#1e1f24"/>
    <circle cx="40" cy="33" r="6" fill="#ff9a3c"/>
    <rect x="56" y="28" width="100" height="10" rx="5" fill="#e6e6e6"/>
    <rect x="200" y="22" width="130" height="22" rx="8" fill="#2f3037"/>
    <circle cx="218" cy="33" r="5" fill="#7c8cff"/>
    <rect x="232" y="29" width="80" height="8" rx="4" fill="#8a8b93"/>
    <rect x="342" y="22" width="130" height="22" rx="8" fill="#2f3037"/>
    <rect x="360" y="29" width="90" height="8" rx="4" fill="#8a8b93"/>

    <!-- Terminal output -->
    <rect x="34" y="86" width="16" height="10" rx="3" fill="#ff9a3c"/>
    <rect x="60" y="86" width="300" height="10" rx="5" fill="#e6e6e6"/>
    <rect x="60" y="114" width="420" height="10" rx="5" fill="#8a8b93"/>
    <rect x="60" y="138" width="360" height="10" rx="5" fill="#8a8b93"/>
    <rect x="60" y="162" width="250" height="10" rx="5" fill="#8a8b93"/>
    <rect x="34" y="198" width="16" height="10" rx="3" fill="#7fd89a"/>
    <rect x="60" y="198" width="210" height="10" rx="5" fill="#7fd89a"/>
    <rect x="60" y="222" width="380" height="10" rx="5" fill="#8a8b93"/>

    <!-- Question prompt -->
    <rect x="34" y="258" width="560" height="74" rx="10" fill="#2b2118" stroke="#ff9a3c" stroke-opacity="0.6"/>
    <rect x="54" y="276" width="260" height="10" rx="5" fill="#ffcf9e"/>
    <rect x="54" y="300" width="90" height="16" rx="8" fill="#ff9a3c"/>
    <rect x="154" y="300" width="90" height="16" rx="8" fill="#3a3b42"/>

    <!-- Prompt line with speech input -->
    <rect x="34" y="352" width="692" height="46" rx="12" fill="#26272d"/>
    <rect x="54" y="370" width="220" height="10" rx="5" fill="#e6e6e6"/>
    <rect x="280" y="366" width="3" height="18" fill="#e6e6e6"/>
    <g transform="translate(686 375)">
      <circle r="17" fill="#ff9a3c"/>
      <rect x="-5" y="-10" width="10" height="15" rx="5" fill="#15161a"/>
      <path d="M-9 1 a9 9 0 0 0 18 0 M0 10 V14" fill="none" stroke="#15161a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
